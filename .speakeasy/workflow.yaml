workflowVersion: 1.0.0
speakeasyVersion: latest
sources:
    UseAgents API:
        inputs:
            - location: https://api.useagents.site/openapi
        overlays:
            - location: .speakeasy/speakeasy-modifications-overlay.yaml
        output: .speakeasy/out.openapi.yaml
        registry:
            location: registry.speakeasyapi.dev/useagents/useagents/use-agents-api
targets:
    use-agents:
        target: typescript
        source: UseAgents API
        codeSamples:
            registry:
                location: registry.speakeasyapi.dev/useagents/useagents/use-agents-api-typescript-code-samples
            labelOverride:
                fixedValue: Typescript (SDK)
            blocking: false
